[project]
name = "itsm-e2e-agents"
version = "0.1.0"
description = "Agents-only incident, problem, and change workflow on one ServiceNow PDI"
requires-python = ">=3.12"
dependencies = [
    "cm-agents",
    "itscm-451z-agent",
    "pydantic>=2",
]

[project.scripts]
e2e = "e2e.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
cm-agents = { path = "../ChangeManagementAgent" }
itscm-451z-agent = { path = "../itscm-451z-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2e"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "live: needs the PDI or the LLM",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
